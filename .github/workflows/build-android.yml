name: Build FIPXEZ CPM2 APK and Windows Worker
on:
  workflow_dispatch:
  push:
    branches: [cpm2-offline-remote]
    paths: ['android/**','worker/**','.github/workflows/build-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate Android platform
        working-directory: android
        run: flutter create --platforms=android --org id.fipxez .
      - name: Resolve packages
        working-directory: android
        run: flutter pub get
      - name: Analyze Dart
        working-directory: android
        run: flutter analyze
      - name: Build APK
        working-directory: android
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FIPXEZ-CPM2-APK
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name FIPXEZ-CPM2-Worker worker/worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: FIPXEZ-CPM2-Windows-Worker
          path: dist/FIPXEZ-CPM2-Worker.exe
          if-no-files-found: error
