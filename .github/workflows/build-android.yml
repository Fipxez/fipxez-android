name: Build FIPXEZ CPM2 APK and Windows Worker
on:
  workflow_dispatch:
  push:
    branches: [cpm2-offline-remote]
    paths: ['android/**','worker/**','.github/workflows/build-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate Android platform
        run: cd android && flutter create --platforms=android --org id.fipxez .
      - name: Configure LAN HTTP permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />' + chr(10) + '    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s=s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
      - name: Resolve packages
        run: cd android && flutter pub get
      - name: Analyze Dart
        run: cd android && flutter analyze
      - name: Build APK
        run: cd android && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FIPXEZ-CPM2-APK
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name FIPXEZ-CPM2-Worker worker/worker.py
      - uses: actions/upload-artifact@v4
        with:
          name: FIPXEZ-CPM2-Windows-Worker
          path: dist/FIPXEZ-CPM2-Worker.exe
          if-no-files-found: error
