name: Build FIPXEZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'backend/**'
      - 'worker/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend worker
      - name: Backend smoke test
        working-directory: backend
        env:
          FIPXEZ_OWNER_TOKEN: ci-owner-token
          FIPXEZ_WORKER_TOKEN: ci-worker-token
          FIPXEZ_DB: /tmp/fipxez-ci.db
        run: |
          python -c "from fastapi.testclient import TestClient; from app.main import app; ctx=TestClient(app); ctx.__enter__(); assert ctx.get('/health').status_code == 200; assert ctx.get('/targets').status_code == 401; assert ctx.get('/targets',headers={'X-Owner-Token':'ci-owner-token'}).json() == []; ctx.__exit__(None,None,None); print('Backend smoke test PASS')"
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        working-directory: android
        run: flutter create --platforms=android --org id.fipxez .
      - name: Resolve packages
        working-directory: android
        run: flutter pub get
      - name: Analyze Dart
        working-directory: android
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: android
        run: flutter test
      - name: Configure Android network permissions
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          if not p.is_file():
              raise SystemExit(f'Missing generated manifest: {p.resolve()}')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '    <uses-permission android:name="android.permission.INTERNET" />\\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          print(f'Configured network permissions: {p}')
          PY
      - name: Build release APK
        working-directory: android
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FIPXEZ-Android-APK
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
